<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Riwayat API</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
        }
        .test-section {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .test-section h2 {
            margin-top: 0;
            color: #0D5C3A;
        }
        .status {
            padding: 5px 10px;
            border-radius: 4px;
            font-weight: bold;
            display: inline-block;
            margin: 5px 0;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        pre {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
        button {
            background: #0D5C3A;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }
        button:hover {
            background: #0a2e1b;
        }
    </style>
</head>
<body>
    <h1>🧪 Test Riwayat Page API Endpoints</h1>
    
    <div class="test-section">
        <h2>1. Monthly Stats</h2>
        <button onclick="testMonthlyStats()">Test Monthly Stats</button>
        <div id="monthly-stats-result"></div>
    </div>

    <div class="test-section">
        <h2>2. Weekly Trend</h2>
        <button onclick="testWeeklyTrend()">Test Weekly Trend</button>
        <div id="weekly-trend-result"></div>
    </div>

    <div class="test-section">
        <h2>3. Status Distribution</h2>
        <button onclick="testStatusDistribution()">Test Status Distribution</button>
        <div id="status-distribution-result"></div>
    </div>

    <div class="test-section">
        <h2>4. SPPG Leaderboard</h2>
        <button onclick="testSppgLeaderboard()">Test SPPG Leaderboard</button>
        <div id="sppg-leaderboard-result"></div>
    </div>

    <div class="test-section">
        <h2>5. Test All Endpoints</h2>
        <button onclick="testAllEndpoints()">Test All Endpoints</button>
        <div id="all-endpoints-result"></div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8000';

        async function testEndpoint(name, url, resultElementId) {
            const resultElement = document.getElementById(resultElementId);
            resultElement.innerHTML = '<p>Loading...</p>';
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.success) {
                    resultElement.innerHTML = `
                        <div class="status success">✓ Success</div>
                        <pre>${JSON.stringify(data.data, null, 2)}</pre>
                    `;
                } else {
                    resultElement.innerHTML = `
                        <div class="status error">✗ Failed</div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                resultElement.innerHTML = `
                    <div class="status error">✗ Error</div>
                    <pre>${error.message}</pre>
                `;
            }
        }

        function testMonthlyStats() {
            testEndpoint('Monthly Stats', `${API_BASE_URL}/api/dashboard/monthly-stats`, 'monthly-stats-result');
        }

        function testWeeklyTrend() {
            testEndpoint('Weekly Trend', `${API_BASE_URL}/api/dashboard/weekly-trend`, 'weekly-trend-result');
        }

        function testStatusDistribution() {
            testEndpoint('Status Distribution', `${API_BASE_URL}/api/dashboard/status-distribution`, 'status-distribution-result');
        }

        function testSppgLeaderboard() {
            testEndpoint('SPPG Leaderboard', `${API_BASE_URL}/api/dashboard/sppg-leaderboard`, 'sppg-leaderboard-result');
        }

        async function testAllEndpoints() {
            const resultElement = document.getElementById('all-endpoints-result');
            resultElement.innerHTML = '<p>Testing all endpoints...</p>';
            
            const endpoints = [
                { name: 'Monthly Stats', url: `${API_BASE_URL}/api/dashboard/monthly-stats` },
                { name: 'Weekly Trend', url: `${API_BASE_URL}/api/dashboard/weekly-trend` },
                { name: 'Status Distribution', url: `${API_BASE_URL}/api/dashboard/status-distribution` },
                { name: 'SPPG Leaderboard', url: `${API_BASE_URL}/api/dashboard/sppg-leaderboard` },
            ];

            const results = [];
            
            for (const endpoint of endpoints) {
                try {
                    const response = await fetch(endpoint.url);
                    const data = await response.json();
                    results.push({
                        name: endpoint.name,
                        success: data.success,
                        dataLength: Array.isArray(data.data) ? data.data.length : 'N/A',
                        data: data.data
                    });
                } catch (error) {
                    results.push({
                        name: endpoint.name,
                        success: false,
                        error: error.message
                    });
                }
            }

            let html = '<h3>Summary:</h3>';
            results.forEach(result => {
                const statusClass = result.success ? 'success' : 'error';
                const statusIcon = result.success ? '✓' : '✗';
                html += `
                    <div class="status ${statusClass}">
                        ${statusIcon} ${result.name}: ${result.success ? 'Success' : 'Failed'}
                        ${result.dataLength !== 'N/A' ? ` (${result.dataLength} items)` : ''}
                    </div>
                `;
            });

            resultElement.innerHTML = html;
        }

        // Auto-run all tests on page load
        window.addEventListener('load', () => {
            console.log('Page loaded, ready to test APIs');
        });
    </script>
</body>
</html>
